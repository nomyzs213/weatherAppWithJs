<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Pogoda teraz</h1>
    <div id="weather-container">
        <img id="weather-icon" src="" alt="obecna pogoda">
        
        <div id="simple-stats">
            <p id="weather-location">Paniówki</p>
            <p id="temperature">23 C</p>
            <p id="current-time">16:03</p>
            
            
        </div>
        
        
    </div>
    
    <div id="weather-stats">

        <div class="stats">
            <h3 class="stat-title">Zachmurzenie</h3>
            <p id="cloudness" class="values">Wartosc</p>
        </div>

        <div class="stats">
            <h3 class="stat-title">Wilgotność</h3>
            <p  id="humidity"  class="values">Wartosc</p>
        </div>

        <div class="stats">
            <h3 class="stat-title">Prędkość wiatru</h3>
            <p id="wind-speed"  class="values">Wartosc</p>
        </div>

        <div class="stats">
            <h3 class="stat-title">Wschód</h3>
            <p id="sunrise-time" class="values" >Wartosc</p>
        </div>

        <div class="stats">
            <h3 class="stat-title">Zachód</h3>
            <p id="sunset-time"  class="values">Wartosc</p>
        </div>

    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
